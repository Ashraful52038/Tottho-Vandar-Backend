version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tottho-postgres
    environment:
      POSTGRES_DB: tottho_vandar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      tottho-network:
        aliases:
          - postgres 
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tottho-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tottho.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - tottho-network
    depends_on:
      - postgres
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  postgres_data:
  pgadmin_data:

networks:
  tottho-network:
    driver: bridge